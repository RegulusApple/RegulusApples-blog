<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegulusApple’s Blog · EVA-01 palette prototype</title>
  <style>
    :root {
      --paper: #fbfaf4;
      --paper-deep: #f0efe7;
      --purple: #604c98;
      --purple-deep: #382b66;
      --green: #a7ca3b;
      --green-soft: #d9e9a1;
      --red: #dd5b54;
      --pink: #eab7c7;
      --blue: #83c8e5;
      --ink: #332747;
      --muted: #7b7289;
      --line: rgba(67, 47, 99, .17);
      --shadow: 0 24px 60px rgba(57, 43, 102, .12);
      --radius: 15px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    html, body { max-width: 100%; overflow-x: hidden; }
    .prototype { min-height: 100vh; width: 100%; overflow-x: clip; background: radial-gradient(circle at 100% 0%, rgba(167, 202, 59, .2), transparent 27rem), radial-gradient(circle at 0% 34%, rgba(131, 200, 229, .18), transparent 30rem), var(--paper); }
    .shell { width: min(1200px, calc(100% - 56px)); margin: 0 auto; }
    .topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; justify-content: space-between; min-height: 78px; border-bottom: 1px solid var(--line); background: transparent; }
    .brand { display: inline-flex; align-items: center; gap: 11px; }
    .brand-mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 10px 10px 10px 2px; background: var(--purple); color: var(--paper); font: italic 20px Georgia, serif; box-shadow: 5px 5px 0 var(--green); }
    .brand-copy { display: grid; gap: 3px; }
    .brand-copy strong { color: var(--purple-deep); font: 700 18px Georgia, serif; letter-spacing: -.04em; }
    .nav { display: flex; align-items: center; gap: 9px; color: var(--purple-deep); font-size: 13px; font-weight: 700; }
    .nav a { padding: 8px 11px; border-radius: 10px; transition: color .2s, background .2s, transform .2s; }
    .nav a:hover, .nav a:focus-visible { color: var(--purple); background: #e9e1f5; transform: translateY(-2px); }
    .status { display: flex; align-items: center; gap: 7px; color: var(--purple-deep); font-size: 10px; font-weight: 700; }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(167, 202, 59, .22); }

    .variant { padding: 70px 0 125px; animation: appear .35s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--purple); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { width: 20px; height: 2px; background: var(--green); content: ''; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
    .hero-title { margin: 22px 0 20px; font-size: clamp(62px, 9vw, 112px); letter-spacing: -.09em; line-height: .82; }
    .hero-title em { color: var(--purple); font-style: italic; }
    .hero-copy { max-width: 450px; color: var(--muted); font-size: 14px; line-height: 1.9; }
    .button-row { display: flex; align-items: center; gap: 22px; margin-top: 29px; }
    .primary { display: inline-flex; align-items: center; gap: 15px; padding: 13px 16px; border: 1px solid var(--purple); border-radius: 11px; background: var(--purple); color: white; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 4px 12px rgba(96, 76, 152, .18); transition: background .2s, border-color .2s, color .2s, transform .2s, box-shadow .2s; }
    .primary .button-text, .secondary .button-text { display: inline-block; transition: transform .2s ease, letter-spacing .2s ease; }
    .primary:hover, .primary:focus-visible { border-color: #8d79bf; background: #8d79bf; transform: translateY(-3px); box-shadow: 0 9px 18px rgba(96, 76, 152, .22); }
    .primary:hover .button-text, .primary:focus-visible .button-text, .secondary:hover .button-text, .secondary:focus-visible .button-text { transform: translateY(-3px); letter-spacing: .14em; }
    .primary:active { border-color: #dcd2f0; background: #dcd2f0; color: var(--purple-deep); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(96, 76, 152, .16); }
    .primary:active .button-text, .secondary:active .button-text { transform: translateY(-1px); }
    .secondary { padding: 8px 10px; border-radius: 10px; color: var(--purple); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; transition: background .2s, color .2s; }
    .secondary:hover, .secondary:focus-visible { color: var(--purple-deep); background: #e9e1f5; }
    .secondary:active { color: var(--purple-deep); background: #dcd2f0; }

    .variant-a .hero { display: grid; grid-template-columns: 1fr .74fr; align-items: center; gap: 95px; }
    .hero-art { position: relative; min-height: 430px; }
    .art-frame { position: absolute; inset: 12px 17% 0 4%; overflow: hidden; border: 1px solid var(--purple); border-radius: 44% 44% 6px 6px; background: linear-gradient(145deg, var(--lavender, #e9e4f4), #f8e8ee); box-shadow: 17px 17px 0 var(--green-soft), var(--shadow); transform: rotate(2deg); }
    .art-frame::before { position: absolute; top: 15%; left: 12%; width: 100px; height: 100px; border-radius: 50%; background: rgba(221, 91, 84, .27); content: ''; filter: blur(2px); }
    .art-frame img { position: absolute; right: -13%; bottom: -3%; width: 112%; height: 90%; object-fit: contain; object-position: center bottom; }
    .art-stamp { position: absolute; top: 7%; right: 0; padding: 7px 9px; border: 1px solid var(--red); border-radius: 8px; color: var(--red); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; transform: rotate(7deg); }
    .art-note { position: absolute; bottom: 5%; left: 0; color: var(--purple); font: italic 15px Georgia, serif; line-height: 1.1; transform: rotate(-7deg); }
    .art-note span { color: var(--muted); font: 9px Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }

    .section-lead { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 100px 0 24px; }
    .section-lead h2 { margin: 12px 0 0; font-size: 48px; letter-spacing: -.07em; line-height: .9; }
    .section-lead h2 em { color: var(--purple); }
    .section-count { color: var(--muted); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .note { position: relative; padding: 23px 24px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.52); box-shadow: 0 5px 0 rgba(96, 76, 152, .04); transition: transform .2s, box-shadow .2s; }
    .note:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .note::before { position: absolute; top: 0; bottom: 0; left: 0; width: 4px; background: var(--purple); content: ''; }
    .note:nth-child(2)::before { background: var(--red); }
    .note:nth-child(3)::before { background: var(--green); }
    .note:nth-child(4)::before { background: var(--blue); }
    .note-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .note h3 { margin: 20px 0 10px; font-size: 25px; letter-spacing: -.04em; }
    .note p { min-height: 42px; margin-bottom: 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .note-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 9px; }
    .note-footer span { color: var(--purple); }
    .note-footer a { color: var(--purple); }
    .note-footer a:hover { color: var(--red); }
    .palette-card { display: grid; grid-template-columns: 1.15fr .85fr; align-items: stretch; gap: 21px; margin-top: 14px; padding: 23px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--purple-deep); color: var(--paper); }
    .palette-card h3 { margin: 0 0 9px; font-size: 25px; }
    .palette-card p { margin: 0; color: rgba(251,250,244,.7); font-size: 11px; line-height: 1.7; }
    .swatches { display: flex; align-items: end; justify-content: end; gap: 7px; }
    .swatches i { display: block; width: 25px; height: 68px; border: 2px solid var(--paper); border-radius: 6px; }
    .swatches i:nth-child(1) { height: 46px; background: var(--purple); }
    .swatches i:nth-child(2) { height: 69px; background: var(--green); }
    .swatches i:nth-child(3) { height: 57px; background: var(--red); }
    .swatches i:nth-child(4) { height: 37px; background: var(--pink); }

    .variant-b { display: grid; grid-template-columns: 74px 1fr; gap: 55px; }
    .rail { border-right: 1px solid var(--line); }
    .rail-text { position: sticky; top: 30px; writing-mode: vertical-rl; color: var(--purple); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
    .variant-b .hero { display: grid; grid-template-columns: .95fr 1fr; align-items: end; gap: 55px; }
    .variant-b .hero-title { font-size: clamp(58px, 7vw, 92px); }
    .wide-art { position: relative; min-height: 365px; border: 1px solid var(--purple); border-radius: var(--radius); background: var(--green-soft); }
    .wide-art::before { position: absolute; inset: 22px; border: 1px dashed var(--purple); border-radius: 10px; content: ''; }
    .wide-art img { position: absolute; right: 0; bottom: -13px; width: 93%; height: 112%; object-fit: contain; object-position: center bottom; }
    .wide-art .art-label { position: absolute; top: 35px; left: 38px; color: var(--purple); font-size: 9px; letter-spacing: .15em; text-transform: uppercase; }
    .b-notes { display: grid; gap: 0; margin-top: 98px; border-top: 1px solid var(--line); }
    .b-note { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 20px; padding: 24px 0; border-bottom: 1px solid var(--line); }
    .b-note-index { color: var(--red); font: italic 22px Georgia, serif; }
    .b-note h3 { margin: 0 0 7px; font-size: 24px; }
    .b-note p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .b-note a { color: var(--purple); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .b-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .b-panel { min-height: 156px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: white; }
    .b-panel h3 { margin: 11px 0 8px; font-size: 22px; }
    .b-panel p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .b-panel.acid { background: var(--green); }
    .b-panel.acid p { color: var(--purple-deep); }
    .b-panel.acid .eyebrow { color: var(--purple-deep); }

    .variant-c .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 75px; align-items: center; }
    .variant-c .hero-title { font-size: clamp(58px, 7.8vw, 104px); }
    .desk { position: relative; min-height: 425px; }
    .desk-card { position: absolute; overflow: hidden; border: 1px solid var(--purple); border-radius: var(--radius); background: white; box-shadow: var(--shadow); }
    .desk-card.large { inset: 6% 10% 1% 3%; padding: 25px; transform: rotate(-3deg); }
    .desk-card.large::after { position: absolute; right: -30px; bottom: -45px; width: 170px; height: 170px; border: 1px solid var(--green); border-radius: 50%; content: ''; }
    .desk-card.large h3 { max-width: 240px; margin: 38px 0 10px; font-size: 36px; line-height: .93; }
    .desk-card.large p { max-width: 220px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .desk-card.large img { position: absolute; right: -10%; bottom: -13%; width: 75%; height: 67%; object-fit: contain; object-position: right bottom; }
    .desk-card.small { right: 0; bottom: 5%; width: 138px; height: 138px; padding: 17px; background: var(--red); color: white; transform: rotate(8deg); }
    .desk-card.small h4 { margin: 0; font: 400 25px Georgia, serif; line-height: .9; }
    .desk-card.small span { position: absolute; right: 15px; bottom: 14px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .desk-card.tiny { top: 0; right: 2%; width: 95px; height: 95px; padding: 11px; background: var(--blue); transform: rotate(5deg); }
    .desk-card.tiny img { width: 100%; height: 100%; object-fit: contain; }
    .desk-section { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; margin-top: 110px; }
    .desk-list, .desk-aside { padding: 23px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.65); }
    .desk-list h2 { margin: 13px 0 26px; font-size: 42px; letter-spacing: -.07em; line-height: .9; }
    .desk-row { display: grid; grid-template-columns: 35px 1fr auto; gap: 14px; align-items: center; padding: 15px 0; border-top: 1px solid var(--line); }
    .desk-row b { color: var(--purple); font: italic 17px Georgia, serif; }
    .desk-row strong { font: 400 18px Georgia, serif; }
    .desk-row span { color: var(--muted); font-size: 9px; text-align: right; }
    .desk-aside { background: var(--purple-deep); color: var(--paper); }
    .desk-aside h3 { max-width: 220px; margin: 48px 0 26px; font-size: 32px; line-height: .95; }
    .desk-aside p { color: rgba(251,250,244,.7); font-size: 11px; line-height: 1.7; }
    .desk-aside .mini-swatches { display: flex; gap: 6px; margin-top: 28px; }
    .mini-swatches i { width: 29px; height: 10px; border-radius: 5px; background: var(--purple); }
    .mini-swatches i:nth-child(2) { background: var(--green); }
    .mini-swatches i:nth-child(3) { background: var(--red); }
    .mini-swatches i:nth-child(4) { background: var(--pink); }

    .variant-d { padding: 0 0 125px; }
    .solitude-layout { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 32px; }
    .solitude-sidebar { position: sticky; top: 108px; align-self: start; padding: 32px 0; }
    .variant-d .solitude-sidebar > .brand { display: none; }
    .solitude-sidebar .brand { margin-bottom: 55px; }
    .solitude-sidebar > .sidebar-profile { width: 100%; margin: 0 0 31px; }
    .sidebar-profile .widget-profile { gap: 9px; }
    .sidebar-profile .widget-profile strong { font-size: 17px; }
    .side-group { margin-bottom: 31px; }
    .side-group h4 { margin: 0 0 13px; color: var(--purple-deep); font-size: 15px; font-weight: 800; letter-spacing: .08em; }
    .side-group a { display: flex; align-items: center; gap: 9px; width: fit-content; padding: 8px 10px; border-radius: 10px; color: var(--purple-deep); font-size: 14px; font-weight: 700; transition: color .2s, background .2s, transform .2s; }
    .side-group a:hover, .side-group a:focus-visible, .side-group a.active { color: var(--purple); background: #e9e1f5; transform: translateY(-2px); }
    .side-group a.active::before { width: 4px; height: 4px; border-radius: 50%; background: var(--green); content: ''; }
    .side-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .side-tags span { padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--purple-deep); font-size: 10px; font-weight: 700; }
    .solitude-main { min-width: 0; max-width: 100%; }
    .solitude-topbar { position: sticky; top: 78px; z-index: 7; display: flex; align-items: center; justify-content: space-between; min-height: 78px; border-bottom: 1px solid var(--line); background: transparent; color: var(--purple-deep); font-size: 12px; font-weight: 700; }
    .top-actions-mini { display: flex; gap: 14px; }
    .top-actions-mini span { padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; color: var(--purple-deep); transition: background .2s, color .2s, transform .2s; }
    .top-actions-mini span:hover { color: var(--purple); background: #e9e1f5; transform: translateY(-2px); }
    .welcome-panel { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); min-height: 324px; margin-top: 39px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(122deg, #f0edf9 0%, #fbfaf4 66%); }
    .welcome-copy { padding: 42px 39px; }
    .welcome-copy h1 { margin: 16px 0 15px; font-size: clamp(46px, 5vw, 73px); letter-spacing: -.08em; line-height: .86; }
    .welcome-copy h1 em { color: var(--purple); font-style: italic; }
    .welcome-copy > p:not(.eyebrow) { max-width: 320px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .welcome-art { position: relative; min-height: 324px; background: var(--green-soft); }
    .welcome-art::before { position: absolute; inset: 28px; border: 1px dashed rgba(56, 43, 102, .32); border-radius: 12px; content: ''; }
    .welcome-art img { position: absolute; right: -14%; bottom: -6%; width: 120%; height: 93%; object-fit: contain; object-position: center bottom; }
    .welcome-art span { position: absolute; right: 21px; bottom: 18px; color: var(--purple-deep); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }
    .variant-d .welcome-panel { background: linear-gradient(112deg, #f0edf9 0%, #f5f1f8 38%, #f8f8f4 68%, #ffffff 100%); }
    .whitesmith-art { background: transparent; }
    .whitesmith-art::before { z-index: 1; border-color: rgba(96, 76, 152, .28); pointer-events: none; }
    .whitesmith-art img { right: 0; bottom: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: 58% 45%; mix-blend-mode: multiply; opacity: .94; }
    .whitesmith-art span { z-index: 2; }
    .solitude-columns { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(230px, .75fr); gap: 28px; margin-top: 63px; }
    .feed-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; }
    .feed-heading h2 { margin: 10px 0 0; font-size: 35px; letter-spacing: -.06em; line-height: .9; }
    .feed-heading h2 em { color: var(--purple); }
    .feed-heading span { color: var(--muted); font-size: 9px; letter-spacing: .1em; }
    .feed-post { display: grid; grid-template-columns: 45px 1fr; gap: 15px; padding: 18px 0; border-top: 1px solid var(--line); }
    .feed-post-index { color: var(--red); font: italic 18px Georgia, serif; }
    .feed-post h3 { margin: 0 0 7px; font-size: 21px; letter-spacing: -.03em; }
    .feed-post p { margin: 0 0 11px; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .feed-post-meta { display: flex; gap: 12px; color: var(--muted); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
    .feed-post-meta span:first-child { color: var(--purple); }
    .widget-column { display: grid; align-content: start; gap: 11px; }
    .widget { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.58); }
    .widget h4 { display: flex; justify-content: space-between; margin: 0 0 19px; color: var(--muted); font: 9px Arial, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
    .widget h4 span { color: var(--purple); }
    .widget-profile { display: flex; align-items: center; gap: 11px; }
    .widget-profile img { width: 42px; height: 42px; border: 2px solid var(--green); border-radius: 50%; object-fit: cover; }
    .widget-profile strong { display: block; margin-bottom: 5px; font: 18px Georgia, serif; }
    .widget-profile span { color: var(--muted); font-size: 9px; }
    .widget > p { margin: 17px 0 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .widget-list { display: grid; gap: 10px; }
    .widget-list a { display: flex; align-items: center; justify-content: space-between; color: var(--ink); font-size: 11px; }
    .widget-list a:hover { color: var(--purple); }
    .widget-list small { color: var(--muted); font-size: 9px; }
    .widget-quote { background: var(--purple); color: var(--paper); }
    .widget-quote h4 { color: var(--green-soft); }
    .widget-quote h4 span { color: var(--green); }
    .widget-quote p { color: rgba(251,250,244,.82); font: italic 16px Georgia, serif; line-height: 1.4; }
    .widget-quote small { color: var(--green-soft); font-size: 8px; letter-spacing: .11em; text-transform: uppercase; }
    .solitude-footer { display: flex; justify-content: space-between; margin-top: 67px; padding-top: 17px; border-top: 1px solid var(--line); color: var(--muted); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
    .solitude-columns.area-single { grid-template-columns: 1fr; }
    .area-panel { min-width: 0; }
    .area-panel .feed-heading { margin-bottom: 27px; }
    .area-panel .feed-heading h2 { font-size: clamp(39px, 5vw, 56px); }
    .archive-rows { border-top: 1px solid var(--line); }
    .archive-row { display: grid; grid-template-columns: 62px 38px 1fr 30px; align-items: center; gap: 15px; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .archive-row strong { color: var(--purple); font: 25px Georgia, serif; }
    .archive-row > span { color: var(--red); font: italic 17px Georgia, serif; }
    .archive-row p { margin: 0; color: var(--ink); font: 18px Georgia, serif; }
    .archive-row i { color: var(--purple); font-style: normal; text-align: right; }
    .category-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .category-matrix div { display: grid; min-height: 142px; align-content: space-between; padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: white; }
    .category-matrix div:nth-child(2) { background: var(--green-soft); }
    .category-matrix div:nth-child(3) { background: #f9e2e8; }
    .category-matrix div:nth-child(4) { background: #e4f3f8; }
    .category-matrix div:nth-child(5) { background: #eee8f8; }
    .category-matrix div:nth-child(6) { background: #fff3d8; }
    .category-matrix span { font: 19px Georgia, serif; }
    .category-matrix strong { color: var(--purple); font: 38px Georgia, serif; }
    .category-matrix small { color: var(--muted); font-size: 9px; letter-spacing: .06em; }

>04 posts</span></div>${posts.map((post, index) => `<article class="feed-post"><span class="feed-post-index">0${index + 1}</span><div><h3>${post.title}</h3><p>${post.excerpt}</p><div class="feed-post-meta"><span>${post.category}</span><span>${post.date}</span><span>Read ↗</span></div></div></article>`).join('')}</section><aside class="widget-column"><section id="about" class="widget"><h4><span>01</span> Myself</h4><div class="widget-profile"><img src="assets/coast.png" alt="RegulusApple 的生活插画"><div><strong>RegulusApple</strong><span>student · maker · reader</span></div></div><p>正在学习如何把好奇心变成作品，也在练习把生活里的微小瞬间认真保存下来。</p></section><section id="categories" class="widget"><h4><span>02</span> Categories</h4><div class="widget-list"><a href="#solitude-workspace">学习 <small>12</small></a><a href="#solitude-workspace">项目 <small>08</small></a><a href="#solitude-workspace">读书 <small>16</small></a><a href="#solitude-workspace">生活 <small>21</small></a><a href="#solitude-workspace">随笔 <small>09</small></a><a href="#solitude-workspace">技术 <small>14</small></a></div></section><section id="archive" class="widget widget-quote"><h4><span>03</span> A note to self</h4><p>“写下来的瞬间，是以后可以重新回去的地方。”</p><small>Record · Remember · Reinvent</small></section></aside></div><footer class="solitude-footer"><span>Posts: 04</span><span>Word count: growing</span><span>© 2026 RegulusApple</span></footer></div></div></main>`);

    }

    function areaSitetime() {
      return areaFrame('about / sitetime', 'A little<br><em>site information.</em>', `<div class="site-stats"><div><strong>04</strong><span>posts in prototype</span></div><div><strong>06</strong><span>areas of curiosity</span></div><div><strong>∞</strong><span>days to keep writing</span></div></div><div class="site-message">这个页面会随着你写下新的文章、照片和想法，慢慢变成真正属于你的时间线。</div>`, 'updated / 2026');
    }

    const solitudeAreas = { article: areaArticle, archive: areaArchive, categories: areaCategories, tags: areaTags, album: areaAlbum, music: areaMusic, myself: areaMyself, links: areaLinks, sitetime: areaSitetime };

    function localizeSolitudeNavigation() {
      const groups = document.querySelectorAll('.variant-d .solitude-sidebar .side-group');
      const groupLabels = ['文章', '记忆', '关于', '兴趣标签'];
      groups.forEach((group, index) => {
        const heading = group.querySelector('h4');
        if (heading) heading.textContent = groupLabels[index] || heading.textContent;
      });
      const itemLabels = ['全部文章', '归档', '分类', '标签', '相册', '音乐', '关于我', '友情链接', '站点信息'];
      document.querySelectorAll('.variant-d .solitude-sidebar [data-area]').forEach((link, index) => {
        link.textContent = itemLabels[index] || link.textContent;
      });
      document.querySelector('.variant-d .solitude-sidebar .brand-copy span')?.remove();
      const topLabel = document.querySelector('.variant-d .solitude-topbar > span');
      if (topLabel) topLabel.textContent = 'RegulusApple · 个人博客 · 2026';
      const topActions = document.querySelectorAll('.variant-d .top-actions-mini span');
      if (topActions[0]) topActions[0].textContent = '☼ 显示模式';
      if (topActions[1]) topActions[1].textContent = '⌕ 搜索';
    }

    function wireButtonMotion() {
      document.querySelectorAll('.primary, .secondary').forEach((button) => {
        if (button.querySelector('.button-text')) return;
        const label = button.textContent;
        button.textContent = '';
        const text = document.createElement('span');
        text.className = 'button-text';
        text.textContent = label;
        button.appendChild(text);
      });
    }

    function wireSolitudeHeroImage() {
      const art = document.querySelector('.variant-d .welcome-art');
      const image = art?.querySelector('img');
      if (!art || !image) return;
      art.classList.add('whitesmith-art');
      image.src = 'assets/whitesmith.jpg';
      image.alt = 'Whitesmith 插画';
      const label = art.querySelector('span');
      if (label) label.textContent = 'Whitesmith · 01';
    }

    function wireSolitudeAvatar() {
      document.querySelectorAll('.variant-d .widget-profile img, .variant-d .about-panel img').forEach((image) => {
        image.src = 'assets/avatar.png';
        image.alt = 'RegulusApple 的新头像';
      });
    }

    function wireSolitudeLayout() {
      const workspace = document.getElementById('solitude-workspace');
      const profile = workspace?.querySelector('#about.widget');
      const sidebar = document.querySelector('.variant-d .solitude-sidebar');
      const firstGroup = sidebar?.querySelector('.side-group');
      if (!workspace || !profile || !sidebar || profile.parentElement === sidebar) return;
      profile.classList.add('sidebar-profile');
      sidebar.insertBefore(profile, firstGroup || null);
    }

    function removeSolitudeSidebarBrand() {
      document.querySelector('.variant-d .solitude-sidebar > .brand')?.remove();
    }

    function showSolitudeArea(area) {
      const workspace = document.getElementById('solitude-workspace');
      if (!workspace || !solitudeAreas[area]) return;
      workspace.className = 'solitude-columns area-single';
      workspace.innerHTML = solitudeAreas[area]();
      wireSolitudeAvatar();
      document.querySelectorAll('.solitude-sidebar [data-area]').forEach((link) => link.classList.toggle('active', link.dataset.area === area));
      const next = new URL(window.location.href);
      next.hash = `area=${area}`;
      history.replaceState({}, '', next);
    }

    function wireVariantD() {
      localizeSolitudeNavigation();
      removeSolitudeSidebarBrand();
      wireSolitudeHeroImage();
      wireSolitudeAvatar();
      wireSolitudeLayout();
      document.querySelectorAll('.variant-d [data-area]').forEach((link) => link.addEventListener('click', (event) => {
        event.preventDefault();
        showSolitudeArea(link.dataset.area);
      }));
      document.querySelectorAll('.variant-d .welcome-panel a, .variant-d .widget-list a').forEach((link) => link.addEventListener('click', (event) => {
        event.preventDefault();
        document.getElementById('solitude-workspace')?.scrollIntoView({ behavior: 'smooth' });
      }));
      const initialArea = window.location.hash.startsWith('#area=') ? window.location.hash.slice(6) : 'article';
      if (initialArea !== 'article' && solitudeAreas[initialArea]) showSolitudeArea(initialArea);
    }

    const renderers = { a: variantA, b: variantB, c: variantC, d: variantD };
    const keys = Object.keys(renderers);
    const params = new URLSearchParams(window.location.search);
    let current = (params.get('variant') || 'a').toLowerCase();
    if (!renderers[current]) current = 'a';

    function render() {
      document.getElementById('app').innerHTML = renderers[current]();
      wireButtonMotion();
      const [key, name] = variantNames[current];
      document.getElementById('switcher-label').innerHTML = `${key} · ${name}<span>← / → to compare</span>`;
      document.title = `RegulusApple’s Blog · ${name}`;
      if (current === 'd') wireVariantD();
      window.scrollTo(0, 0);
    }

    function move(direction) {
      const index = keys.indexOf(current);
      current = keys[(index + direction + keys.length) % keys.length];
      const next = new URL(window.location.href);
      next.searchParams.set('variant', current);
      history.replaceState({}, '', next);
      render();
    }

    document.getElementById('prev').addEventListener('click', () => move(-1));
    document.getElementById('next').addEventListener('click', () => move(1));
    document.addEventListener('keydown', (event) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
    });
    render();
  </script>
</body>
</html>
