<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halfold's Blog · Solitude hybrid prototype</title>
  <style>
    /* THREE VARIANTS, ONE ROUTE: ?variant=A|B|C. Throwaway UI prototype only. */
    :root {
      --bg: #fbfaf4;
      --bg-soft: #f2f4dc;
      --panel: #ffffff;
      --panel-soft: #f8f7ef;
      --ink: #2f2648;
      --muted: #7f7890;
      --purple: #4d377c;
      --purple-soft: #7e69a9;
      --green: #afd52d;
      --green-soft: #eff8c4;
      --line: #e7e0ed;
      --shadow: 0 18px 44px rgba(77, 55, 124, .10);
      --radius: 24px;
    }

    html[data-theme="dark"] {
      --bg: #211b35;
      --bg-soft: #2a2244;
      --panel: #2d2647;
      --panel-soft: #352d51;
      --ink: #f3effc;
      --muted: #b8afcf;
      --purple: #c6b5f4;
      --purple-soft: #a895d8;
      --green: #c1e342;
      --green-soft: #3d4620;
      --line: rgba(220, 208, 246, .16);
      --shadow: 0 18px 44px rgba(0, 0, 0, .20);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; transition: color .2s ease, background .2s ease; }
    button, a, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .prototype-note { position: fixed; z-index: 20; top: 12px; left: 50%; padding: 6px 12px; color: var(--purple); border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--bg) 88%, transparent); font-size: 10px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; transform: translateX(-50%); backdrop-filter: blur(12px); }
    .hybrid-shell { width: min(1500px, calc(100% - 56px)); margin: 0 auto; padding: 64px 0 120px; }
    .hybrid-header { display: flex; align-items: center; justify-content: space-between; gap: 28px; min-height: 64px; padding: 0 4px 22px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 12px; min-width: 220px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; color: white; border-radius: 14px 20px 10px 18px; background: var(--purple); box-shadow: 7px 7px 0 var(--green); font-family: Georgia, serif; font-size: 25px; font-style: italic; }
    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { font-family: Georgia, serif; font-size: 18px; }
    .brand-copy small { color: var(--muted); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .top-nav { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .top-nav a, .top-nav button { padding: 9px 12px; color: var(--purple); border: 0; border-radius: 12px; background: transparent; font-size: 12px; font-weight: 850; }
    .top-nav a:hover, .top-nav button:hover { color: white; background: var(--purple); }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 260px; }
    .signal-status { display: inline-flex; align-items: center; gap: 7px; color: var(--purple); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .signal-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px color-mix(in srgb, var(--green) 24%, transparent); }
    .control-button { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 50%; background: transparent; }
    .control-button:hover, .control-button:focus-visible { color: white; background: var(--purple); }
    .glass { position: relative; width: 16px; height: 16px; display: block; border: 2px solid currentColor; border-radius: 50%; transform: translate(-4px, -4px); }
    .glass::after { position: absolute; top: 10px; left: 11px; width: 10px; height: 3px; border-radius: 999px; background: currentColor; content: ''; transform: rotate(45deg); transform-origin: left center; }
    .theme-button { display: inline-flex; align-items: center; gap: 5px; padding: 8px 11px; color: var(--purple); border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 11px; font-weight: 850; }
    .theme-button:hover { color: white; border-color: var(--purple); background: var(--purple); }

    .workspace-a { display: grid; grid-template-columns: 220px minmax(0, 1fr) 250px; gap: 28px; padding-top: 28px; }
    .workspace-a > *, .console-grid > *, .quiet-layout > * { min-width: 0; }
    .side-rail { display: grid; align-content: start; gap: 22px; }
    .profile-card, .widget, .console-card, .featured-card, .feed-card, .quiet-card, .memory-band { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .profile-card { padding: 18px; }
    .index-line, .section-kicker, .widget-title { color: var(--purple-soft); font-size: 10px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .index-line { display: flex; justify-content: space-between; margin-bottom: 18px; }
    .profile-head { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 46px; height: 46px; overflow: hidden; border: 2px solid var(--green); border-radius: 50%; background: var(--bg-soft); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-head strong { display: block; font-family: Georgia, serif; font-size: 17px; }
    .profile-head small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .profile-card p { margin: 17px 0 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .side-nav { display: grid; gap: 19px; padding: 0 4px; }
    .nav-group { display: grid; gap: 7px; }
    .nav-group h3 { margin: 0 0 3px; font-size: 12px; }
    .nav-group a { width: fit-content; padding: 2px 8px; color: var(--purple-soft); font-size: 12px; font-weight: 800; border-radius: 8px; }
    .nav-group a:hover, .nav-group a.active { color: var(--purple); background: var(--green-soft); }
    .side-note { padding: 15px; border-left: 3px solid var(--green); color: var(--muted); background: var(--bg-soft); font-family: Georgia, serif; font-size: 12px; line-height: 1.7; }

    .main-column { display: grid; gap: 22px; }
    .signal-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; color: var(--muted); font-size: 11px; }
    .signal-line strong { color: var(--purple); font-size: 12px; }
    .signal-line .pulse { display: inline-flex; align-items: center; gap: 7px; }
    .pulse i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .featured-card { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(280px, .95fr); overflow: hidden; }
    .featured-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(26px, 4vw, 52px); }
    .featured-copy h1 { max-width: 520px; margin: 14px 0 18px; font-family: Georgia, serif; font-size: clamp(42px, 5vw, 78px); line-height: .9; letter-spacing: -.06em; }
    .featured-copy h1 em, .section-title em { color: var(--purple-soft); font-weight: 400; }
    .featured-copy p { max-width: 470px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.9; }
    .button-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .primary-button { display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; color: white; border-radius: 13px; background: var(--purple); box-shadow: 0 12px 24px color-mix(in srgb, var(--purple) 20%, transparent); font-size: 11px; font-weight: 850; }
    .primary-button:hover { transform: translateY(-2px); }
    .ghost-button { padding: 10px 12px; color: var(--purple); border: 0; background: transparent; font-size: 11px; font-weight: 850; }
    .featured-art { position: relative; min-height: 315px; overflow: hidden; background: var(--bg-soft); }
    .featured-art img { width: 100%; height: 100%; object-fit: cover; }
    .art-label { position: absolute; right: 16px; bottom: 16px; padding: 7px 10px; color: var(--purple); border: 1px solid color-mix(in srgb, var(--purple) 18%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--panel) 82%, transparent); font-size: 9px; font-weight: 900; letter-spacing: .12em; }

    .feed-card { padding: 24px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .section-title { margin: 6px 0 0; font-family: Georgia, serif; font-size: 28px; line-height: 1; letter-spacing: -.04em; }
    .section-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .filter-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
    .filter-row button { padding: 7px 10px; color: var(--purple-soft); border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 10px; font-weight: 850; white-space: nowrap; }
    .filter-row button:hover, .filter-row button.active { color: white; border-color: var(--purple); background: var(--purple); }
    .post-list { display: grid; gap: 0; margin-top: 16px; }
    .post-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 78px; align-items: center; gap: 14px; padding: 17px 0; border-top: 1px solid var(--line); }
    .post-index { color: var(--purple-soft); font-family: Georgia, serif; font-size: 18px; }
    .post-main { min-width: 0; }
    .post-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 10px; }
    .post-meta span { padding: 3px 6px; border-radius: 6px; background: var(--bg-soft); }
    .post-meta .new { color: var(--purple); background: var(--green-soft); font-weight: 900; }
    .post-row h3 { margin: 7px 0 5px; font-family: Georgia, serif; font-size: 18px; }
    .post-row p { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; text-overflow: ellipsis; white-space: nowrap; }
    .post-arrow { justify-self: end; padding: 9px 11px; color: var(--purple); border: 1px solid var(--line); border-radius: 11px; font-size: 15px; }
    .post-arrow:hover { color: white; border-color: var(--purple); background: var(--purple); }

    .widget-column { display: grid; align-content: start; gap: 16px; }
    .widget { padding: 18px; }
    .widget h3 { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 15px; font-size: 12px; }
    .widget h3 span { color: var(--purple-soft); font-family: Georgia, serif; font-size: 17px; font-weight: 400; }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-cloud a { padding: 5px 7px; color: var(--purple-soft); border-radius: 7px; background: var(--bg-soft); font-size: 10px; font-weight: 800; }
    .tag-cloud a:hover { color: var(--purple); background: var(--green-soft); }
    .metric-list { display: grid; gap: 11px; }
    .metric { display: flex; align-items: end; justify-content: space-between; gap: 10px; padding-bottom: 9px; border-bottom: 1px dashed var(--line); }
    .metric:last-child { padding-bottom: 0; border-bottom: 0; }
    .metric small { color: var(--muted); font-size: 10px; }
    .metric strong { color: var(--purple); font-family: Georgia, serif; font-size: 17px; }
    .currently { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px; }
    .disc { width: 48px; height: 48px; display: grid; place-items: center; color: var(--green); border-radius: 50%; background: var(--purple); font-size: 20px; }
    .currently strong { display: block; font-family: Georgia, serif; font-size: 14px; }
    .currently small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .countdown { background: var(--purple); color: white; }
    .countdown .widget-title, .countdown h3 { color: var(--green); }
    .countdown strong { display: block; margin-top: 10px; font-family: Georgia, serif; font-size: 27px; }
    .countdown p { margin: 4px 0 0; color: #ded5f5; font-size: 10px; }
    .progress { height: 5px; margin-top: 15px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.17); }
    .progress i { display: block; width: 62%; height: 100%; border-radius: inherit; background: var(--green); }

    .variant-b { display: grid; gap: 22px; padding-top: 28px; }
    .variant-b .hybrid-header { margin-bottom: 0; }
    .dashboard-hero { display: grid; grid-template-columns: 1fr .82fr; gap: 20px; }
    .dashboard-copy { padding: clamp(28px, 5vw, 65px); border-radius: var(--radius); background: var(--purple); color: white; box-shadow: var(--shadow); }
    .dashboard-copy .section-kicker { color: var(--green); }
    .dashboard-copy h1 { max-width: 660px; margin: 15px 0; font-family: Georgia, serif; font-size: clamp(45px, 7vw, 92px); line-height: .86; letter-spacing: -.07em; }
    .dashboard-copy h1 em { color: #d5c8f8; font-weight: 400; }
    .dashboard-copy p { max-width: 480px; margin: 0; color: #ded5f5; font-size: 13px; line-height: 1.8; }
    .dashboard-art { min-height: 330px; overflow: hidden; border-radius: var(--radius); background: var(--bg-soft); box-shadow: var(--shadow); }
    .dashboard-art img { width: 100%; height: 100%; object-fit: cover; }
    .console-strip { display: grid; grid-template-columns: 1.1fr repeat(3, 1fr); gap: 10px; }
    .console-pill { min-height: 74px; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); box-shadow: var(--shadow); }
    .console-pill small { display: block; color: var(--muted); font-size: 10px; }
    .console-pill strong { display: block; margin-top: 8px; color: var(--purple); font-family: Georgia, serif; font-size: 19px; }
    .console-pill button { padding: 0; border: 0; background: transparent; font-weight: 900; }
    .console-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr); gap: 20px; }
    .stream-panel, .console-board { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .stream-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 12px; }
    .stream-head h2 { margin: 5px 0 0; font-family: Georgia, serif; font-size: 28px; }
    .stream-head span { color: var(--muted); font-size: 10px; }
    .stream-item { display: grid; grid-template-columns: 46px minmax(0, 1fr) 60px; gap: 14px; align-items: center; padding: 18px 0; border-top: 1px solid var(--line); }
    .stream-cover { width: 46px; height: 46px; overflow: hidden; border-radius: 13px; background: var(--bg-soft); }
    .stream-cover img { width: 100%; height: 100%; object-fit: cover; }
    .stream-item h3 { margin: 0 0 5px; font-family: Georgia, serif; font-size: 16px; }
    .stream-item p { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .stream-item time { justify-self: end; color: var(--purple-soft); font-size: 10px; }
    .console-board { display: grid; align-content: start; gap: 19px; background: var(--bg-soft); }
    .console-board h3 { margin: 0; font-size: 12px; }
    .board-menu { display: grid; gap: 8px; }
    .board-menu a, .board-menu button { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; color: var(--purple); border: 1px solid var(--line); border-radius: 11px; background: var(--panel); font-size: 11px; font-weight: 850; text-align: left; }
    .board-menu a:hover, .board-menu button:hover { border-color: var(--purple); }
    .board-menu small { color: var(--muted); font-size: 10px; }
    .memory-band { display: grid; grid-template-columns: .85fr 1.15fr; gap: 20px; padding: 22px; background: var(--panel-soft); }
    .memory-band h2 { margin: 7px 0 0; font-family: Georgia, serif; font-size: 29px; line-height: 1; }
    .memory-band p { max-width: 270px; margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .memory-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .memory-thumbs figure { min-height: 132px; overflow: hidden; margin: 0; border-radius: 15px; background: var(--bg-soft); }
    .memory-thumbs img { width: 100%; height: 100%; object-fit: cover; }

    .variant-c { display: grid; gap: 22px; padding-top: 28px; }
    .variant-c .hybrid-header { max-width: 1120px; margin: 0 auto; }
    .quiet-layout { display: grid; grid-template-columns: minmax(0, 1fr) 235px; gap: 24px; max-width: 1120px; margin: 0 auto; }
    .quiet-main { display: grid; gap: 20px; }
    .quiet-hero { padding: clamp(28px, 5vw, 60px); border: 1px solid var(--line); border-radius: 30px; background: linear-gradient(135deg, var(--panel) 0 61%, var(--bg-soft) 61%); box-shadow: var(--shadow); }
    .quiet-hero h1 { max-width: 630px; margin: 15px 0; font-family: Georgia, serif; font-size: clamp(46px, 7vw, 88px); line-height: .86; letter-spacing: -.07em; }
    .quiet-hero h1 em { color: var(--purple-soft); font-weight: 400; }
    .quiet-hero p { max-width: 480px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .quiet-filter { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 2px 0 10px; border-bottom: 1px solid var(--line); }
    .quiet-filter strong { font-family: Georgia, serif; font-size: 22px; }
    .quiet-filter span { color: var(--muted); font-size: 10px; }
    .reading-feed { display: grid; gap: 10px; }
    .quiet-card { display: grid; grid-template-columns: 120px minmax(0, 1fr) 36px; gap: 18px; align-items: center; padding: 12px; box-shadow: none; }
    .quiet-cover { height: 90px; overflow: hidden; border-radius: 16px; background: var(--bg-soft); }
    .quiet-cover img { width: 100%; height: 100%; object-fit: cover; }
    .quiet-card h3 { margin: 7px 0 5px; font-family: Georgia, serif; font-size: 18px; }
    .quiet-card p { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; text-overflow: ellipsis; white-space: nowrap; }
    .quiet-arrow { width: 32px; height: 32px; display: grid; place-items: center; color: var(--purple); border: 1px solid var(--line); border-radius: 50%; }
    .quiet-arrow:hover { color: white; background: var(--purple); }
    .quiet-rail { display: grid; align-content: start; gap: 14px; }
    .rail-block { padding: 17px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
    .rail-block h3 { margin: 0 0 15px; font-size: 12px; }
    .rail-block p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .rail-links { display: grid; gap: 8px; }
    .rail-links a { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); color: var(--purple-soft); font-size: 11px; font-weight: 800; }
    .rail-links a:last-child { border-bottom: 0; }
    .rail-links a:hover { color: var(--purple); }
    .quote { border-left: 3px solid var(--green); }
    .quote p { color: var(--ink); font-family: Georgia, serif; font-size: 15px; }

    .prototype-switcher { position: fixed; z-index: 30; bottom: 18px; left: 50%; display: flex; align-items: center; gap: 8px; padding: 7px; border: 1px solid color-mix(in srgb, var(--purple) 26%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--panel) 90%, transparent); box-shadow: 0 14px 38px rgba(35, 24, 61, .18); transform: translateX(-50%); backdrop-filter: blur(14px); }
    .prototype-switcher button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--purple); border: 0; border-radius: 50%; background: transparent; font-size: 17px; }
    .prototype-switcher button:hover { color: white; background: var(--purple); }
    .variant-label { min-width: 175px; padding: 0 7px; color: var(--muted); font-size: 10px; font-weight: 850; text-align: center; }
    .variant-label strong { color: var(--purple); }
    .search-modal[hidden], .console-drawer[hidden] { display: none; }
    .search-modal { position: fixed; z-index: 40; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(25, 17, 45, .46); backdrop-filter: blur(6px); }
    .search-box { width: min(520px, 100%); padding: 24px; border: 1px solid var(--line); border-radius: 23px; background: var(--panel); box-shadow: 0 30px 80px rgba(24, 16, 45, .28); }
    .search-box-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .search-box h2 { margin: 0; font-family: Georgia, serif; font-size: 26px; }
    .close-button { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--bg-soft); font-size: 18px; }
    .search-box input { width: 100%; margin-top: 22px; padding: 13px 14px; color: var(--ink); border: 1px solid var(--line); border-radius: 13px; outline: 0; background: var(--panel-soft); }
    .search-box input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px color-mix(in srgb, var(--purple) 12%, transparent); }
    .search-result { min-height: 20px; margin: 13px 0 0; color: var(--muted); font-size: 11px; }
    .console-drawer { position: fixed; z-index: 25; top: 72px; right: 28px; width: min(360px, calc(100% - 40px)); padding: 19px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: 0 22px 60px rgba(24, 16, 45, .20); }
    .console-drawer h3 { margin: 0 0 14px; font-family: Georgia, serif; font-size: 20px; }
    .drawer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .drawer-grid a, .drawer-grid button { padding: 10px; color: var(--purple); border: 1px solid var(--line); border-radius: 11px; background: var(--bg-soft); font-size: 10px; font-weight: 850; text-align: left; }
    .drawer-grid a:hover, .drawer-grid button:hover { border-color: var(--purple); }

    @media (max-width: 1120px) {
      .workspace-a { grid-template-columns: 190px minmax(0, 1fr); }
      .widget-column { grid-column: 1 / -1; grid-template-columns: repeat(3, 1fr); }
      .console-strip { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 820px) {
      .prototype-note { display: none; }
      .hybrid-shell { width: min(100% - 28px, 680px); padding-top: 24px; }
      .hybrid-header { align-items: flex-start; flex-wrap: wrap; gap: 13px; padding-bottom: 16px; }
      .brand { min-width: 0; }
      .top-nav { order: 3; width: 100%; justify-content: flex-start; overflow-x: auto; }
      .header-actions { min-width: 0; margin-left: auto; }
      .signal-status { display: none; }
      .workspace-a, .dashboard-hero, .console-grid, .quiet-layout { grid-template-columns: 1fr; }
      .side-rail { grid-template-columns: 1fr 1fr; align-items: start; }
      .side-note { display: none; }
      .featured-card { grid-template-columns: 1fr; }
      .featured-art, .dashboard-art { min-height: 230px; max-height: 280px; }
      .widget-column { grid-column: auto; grid-template-columns: 1fr 1fr; }
      .console-strip { grid-template-columns: 1fr 1fr; }
      .memory-band { grid-template-columns: 1fr; }
      .quiet-rail { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 540px) {
      .brand-copy small { display: none; }
      .top-nav a, .top-nav button { padding: 7px 8px; }
      .side-rail, .widget-column, .quiet-rail { grid-template-columns: 1fr; }
      .profile-card { grid-column: 1 / -1; }
      .feed-card, .stream-panel, .console-board { padding: 18px; }
      .post-row { grid-template-columns: 28px minmax(0, 1fr); gap: 9px; }
      .post-arrow { display: none; }
      .quiet-card { grid-template-columns: 74px minmax(0, 1fr); gap: 11px; }
      .quiet-cover { height: 74px; }
      .quiet-arrow { display: none; }
      .variant-label { min-width: 137px; }
    }
  </style>
</head>
<body>
  <div class="prototype-note">throwaway UI prototype · current palette × solitude structure</div>
  <div id="app"></div>

  <div class="search-modal" id="search-modal" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="search-box-head"><h2 id="search-title">Search the notes.</h2><button class="close-button" type="button" data-search-close aria-label="关闭搜索">×</button></div>
      <input id="search-input" type="search" placeholder="搜索标题、标签或关键词……" autocomplete="off">
      <p class="search-result" id="search-result">这是原型中的搜索控件示意。</p>
    </div>
  </div>

  <div class="prototype-switcher" aria-label="Prototype variant switcher">
    <button type="button" data-previous aria-label="上一个方案">←</button>
    <span class="variant-label" id="variant-label"></span>
    <button type="button" data-next aria-label="下一个方案">→</button>
  </div>

  <script>
    const posts = [
      { category: '学习', date: '2026.08.26', title: '把学习变成一个可复盘的系统', excerpt: '记录输入、练习、反馈和下一次调整，让成长不只停留在感觉里。', image: 'assets/reading.png', tags: ['学习', '方法'], isNew: true },
      { category: '项目', date: '2026.08.20', title: '一个小项目的复盘', excerpt: '从想法到实现，中间那些没有被截图保存下来的决定也值得回看。', image: 'assets/whitesmith.jpg', tags: ['项目', '复盘'] },
      { category: '读书', date: '2026.08.12', title: '在变化里保持清醒', excerpt: '读完一本书之后，留下的不是结论，而是几个更准确的问题。', image: 'assets/coast.png', tags: ['读书', '随笔'] },
      { category: '生活', date: '2026.08.05', title: '给未来自己的短笺', excerpt: '把最近的犹豫和一点点确定，放进以后可以重新打开的地方。', image: 'assets/cycling.png', tags: ['生活', '记录'] }
    ];
    const categories = ['全部', '学习', '项目', '读书', '生活', '随笔'];
    const variants = [
      { key: 'A', name: 'Sidebar workspace' },
      { key: 'B', name: 'Console dashboard' },
      { key: 'C', name: 'Quiet reader' }
    ];
    let activeFilter = '全部';

    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    const filteredPosts = () => activeFilter === '全部' ? posts : posts.filter((post) => post.category === activeFilter || post.tags.includes(activeFilter));
    const header = (extraClass = '') => `
      <header class="hybrid-header ${extraClass}">
        <a class="brand" href="?variant=A" aria-label="回到 Halfold's Blog 原型首页"><span class="brand-mark">H</span><span class="brand-copy"><strong>Halfold's Blog</strong><small>Record · Remember · Reinvent</small></span></a>
        <nav class="top-nav" aria-label="主导航"><a href="#articles">文章</a><a href="#archive">归档</a><a href="#memory">记忆</a><a href="#about">关于</a><button type="button" data-console-toggle>Console</button></nav>
        <div class="header-actions"><span class="signal-status"><i></i>清新记录中</span><button class="control-button" type="button" data-search-open aria-label="打开搜索"><span class="glass" aria-hidden="true"></span></button><button class="theme-button" type="button" data-theme-toggle><span data-theme-icon>☼</span><span data-theme-label>浅色</span></button></div>
      </header>`;

    const profile = () => `
      <section class="profile-card" id="about"><div class="index-line"><span>01</span><span>MYSELF</span></div><div class="profile-head"><span class="avatar"><img src="assets/avatar.png" alt="Halfold 头像"></span><span><strong>Halfold</strong><small>student · maker · reader</small></span></div><p>正在学习如何把好奇心变成作品，也在练习把生活里的微小瞬间认真保存下来。</p></section>`;
    const sideNav = () => `<nav class="side-nav"><div class="nav-group"><h3>文章</h3><a class="active" href="#articles">全部文章</a><a href="#archive">归档</a><a href="#categories">分类</a><a href="#tags">标签</a></div><div class="nav-group"><h3>记忆</h3><a href="#memory">相册</a><a href="#music">音乐</a><a href="#reading">读书架</a></div><div class="nav-group"><h3>关于</h3><a href="#about">关于我</a><a href="#links">友情链接</a><a href="#stats">站点统计</a></div></nav>`;
    const filterBar = () => `<div class="filter-row" role="toolbar" aria-label="文章筛选">${categories.map((category) => `<button type="button" class="${activeFilter === category ? 'active' : ''}" data-filter="${category}">${category}</button>`).join('')}</div>`;
    const postRows = (mode = 'row') => filteredPosts().map((post, index) => mode === 'stream' ? `
      <article class="stream-item"><span class="stream-cover"><img src="${post.image}" alt=""></span><div><h3>${post.title}</h3><p>${post.excerpt}</p></div><time>${post.date.slice(5)}</time></article>` : mode === 'quiet' ? `
      <article class="quiet-card"><span class="quiet-cover"><img src="${post.image}" alt=""></span><div><div class="post-meta"><span>${post.category}</span>${post.isNew ? '<span class="new">New</span>' : ''}<span>${post.date}</span></div><h3>${post.title}</h3><p>${post.excerpt}</p></div><a class="quiet-arrow" href="#articles" aria-label="阅读文章">↗</a></article>` : `
      <article class="post-row"><span class="post-index">0${index + 1}</span><div class="post-main"><div class="post-meta"><span>${post.category}</span>${post.isNew ? '<span class="new">New</span>' : ''}<span>Unread</span><span>${post.date}</span></div><h3><a href="#articles">${post.title}</a></h3><p>${post.excerpt}</p></div><a class="post-arrow" href="#articles" aria-label="阅读文章">↗</a></article>`).join('');
    const tags = () => `<div class="tag-cloud" id="tags"><a href="#articles">学习<sup>12</sup></a><a href="#articles">项目<sup>08</sup></a><a href="#articles">读书<sup>16</sup></a><a href="#articles">生活<sup>21</sup></a><a href="#articles">随笔<sup>09</sup></a><a href="#articles">技术<sup>14</sup></a></div>`;
    const metrics = () => `<div class="metric-list" id="stats"><div class="metric"><small>Posts</small><strong>06</strong></div><div class="metric"><small>Word count</small><strong>12.8k</strong></div><div class="metric"><small>Last update</small><strong>08.26</strong></div></div>`;

    const variantA = () => `<div class="hybrid-shell variant-a">${header()}<div class="workspace-a"><aside class="side-rail">${profile()}${sideNav()}<div class="side-note">把正在发生的事，慢慢写成以后可以回看的地方。</div></aside><main class="main-column"><div class="signal-line"><span class="pulse"><i></i><strong>最近的一句话：</strong>今天也在练习把复杂的事说清楚。</span><span>06 notes · 2026</span></div><section class="featured-card"><div class="featured-copy"><span class="section-kicker">welcome to my little corner</span><h1>Halfold's<br><em>Blog.</em></h1><p>Record，Remember，Reinvent，Revolutionize。把学习、项目、读书与生活，慢慢放进一个可以回看的地方。</p><div class="button-row"><a class="primary-button" href="#articles">阅读最近文章 <span>↗</span></a><button class="ghost-button" type="button" data-search-open>打开搜索</button></div></div><div class="featured-art"><img src="assets/reading.png" alt="读书插画"><span class="art-label">WHITESMITH · 01</span></div></section><section class="feed-card" id="articles"><div class="section-heading"><div><span class="section-kicker">recent notes</span><h2 class="section-title">找到一些<br><em>值得留下的事。</em></h2></div><span class="section-count">${posts.length} 篇文章</span></div>${filterBar()}<div class="post-list" data-filter-list>${postRows()}</div></section></main><aside class="widget-column"><section class="widget" id="archive"><h3><span>02</span> Archive</h3><div class="metric-list"><div class="metric"><small>2026</small><strong>06</strong></div><div class="metric"><small>2025</small><strong>12</strong></div><div class="metric"><small>All posts</small><strong>18</strong></div></div></section><section class="widget"><h3><span>03</span> Find interesting areas</h3>${tags()}</section><section class="widget" id="music"><h3><span>04</span> Currently</h3><div class="currently"><div class="disc">♪</div><div><strong>Quiet mornings</strong><small>music · paused</small></div></div></section><section class="widget countdown"><span class="widget-title">a small countdown</span><strong>128 days</strong><p>until the next chapter begins.</p><div class="progress"><i></i></div></section></aside></div></div>`;

    const variantB = () => `<div class="hybrid-shell variant-b">${header()}<section class="dashboard-hero"><div class="dashboard-copy"><span class="section-kicker">archive / console / 001</span><h1>A softer<br><em>signal.</em></h1><p>把当前主题的轻盈纸面和 Solitude 的信息控制台放在一起：更密集，但仍然留出呼吸的地方。</p><div class="button-row"><a class="primary-button" href="#console">进入控制台 <span>↗</span></a><button class="ghost-button" type="button" data-search-open>Search the notes</button></div></div><div class="dashboard-art"><img src="assets/cycling.png" alt="骑行插画"></div></section><section class="console-strip" id="console"><div class="console-pill"><small>now / here</small><strong><button type="button" data-console-toggle>打开 Console →</button></strong></div><div class="console-pill"><small>Posts</small><strong>06</strong></div><div class="console-pill"><small>Runtime</small><strong>128d</strong></div><div class="console-pill"><small>Display</small><strong><button type="button" data-theme-toggle>浅色 / 深色</button></strong></div></section><div class="console-grid"><section class="stream-panel" id="articles"><div class="stream-head"><div><span class="section-kicker">recommend / all articles</span><h2>Recent notes.</h2></div><span>scroll the archive</span></div>${filterBar()}<div data-filter-list>${postRows('stream')}</div></section><aside class="console-board"><div><span class="section-kicker">console board</span><h3>把常用入口放在一张桌面上。</h3></div><div class="board-menu"><a href="#archive"><span>Archive</span><small>18 posts ↗</small></a><a href="#tags"><span>Tags</span><small>6 areas ↗</small></a><a href="#links"><span>Useful links</span><small>open ↗</small></a><button type="button" data-search-open><span>Search</span><small>⌕</small></button><button type="button" data-back-top><span>Back to top</span><small>↑</small></button></div><div class="widget" id="tags"><h3><span>05</span> Tag cloud</h3>${tags()}</div></aside></div><section class="memory-band" id="memory"><div><span class="section-kicker">memory shelf</span><h2>生活也值得<br><em>被保存。</em></h2><p>这是偏 Solitude 的信息密度版本：把主页做成一个可以不断探索的小型个人档案馆。</p></div><div class="memory-thumbs"><figure><img src="assets/coast.png" alt="海边插画"></figure><figure><img src="assets/reading.png" alt="读书插画"></figure><figure><img src="assets/plane.png" alt="飞机插画"></figure></div></section></div>`;

    const variantC = () => `<div class="hybrid-shell variant-c">${header()}<main class="quiet-layout"><section class="quiet-main"><section class="quiet-hero"><span class="section-kicker">a personal archive / 2026</span><h1>Keep the<br><em>small signal.</em></h1><p>更安静的阅读型方案：保留 Solitude 的状态信息和文章元数据，把侧栏收窄成不打扰正文的工具轨。</p><div class="button-row"><a class="primary-button" href="#articles">开始阅读 <span>↗</span></a><button class="ghost-button" type="button" data-console-toggle>打开工具轨</button></div></section><div class="quiet-filter" id="articles"><strong>Find something to keep.</strong><span>06 recent notes / ${new Date().getFullYear()}</span></div>${filterBar()}<section class="reading-feed" data-filter-list>${postRows('quiet')}</section></section><aside class="quiet-rail"><section class="rail-block"><span class="section-kicker">site information</span><h3>这个角落目前的状态</h3>${metrics()}</section><section class="rail-block" id="reading"><span class="section-kicker">reading shelf</span><h3>正在读</h3><div class="rail-links"><a href="#articles"><span>清醒地活</span><span>↗</span></a><a href="#articles"><span>Designing Data</span><span>↗</span></a><a href="#articles"><span>The Creative Act</span><span>↗</span></a></div></section><section class="rail-block quote" id="links"><span class="section-kicker">a note to self</span><p>写下来的瞬间，是以后可以重新回去的地方。</p></section><section class="rail-block"><span class="section-kicker">quick controls</span><div class="rail-links"><a href="#archive"><span>Archive</span><span>06</span></a><a href="#tags"><span>Tags</span><span>06</span></a><a href="#music"><span>Music</span><span>♪</span></a><button class="ghost-button" type="button" data-back-top>回到顶部 ↑</button></div></section></aside></main></div>`;

    function currentKey() {
      const requested = new URLSearchParams(window.location.search).get('variant');
      return variants.some((variant) => variant.key === requested) ? requested : 'A';
    }

    function render() {
      const key = currentKey();
      document.getElementById('app').innerHTML = key === 'B' ? variantB() : key === 'C' ? variantC() : variantA();
      const meta = variants.find((variant) => variant.key === key);
      document.getElementById('variant-label').innerHTML = `<strong>${meta.key}</strong> · ${meta.name}`;
      document.querySelectorAll('[data-theme-icon]').forEach((node) => { node.textContent = document.documentElement.dataset.theme === 'dark' ? '☾' : '☼'; });
      document.querySelectorAll('[data-theme-label]').forEach((node) => { node.textContent = document.documentElement.dataset.theme === 'dark' ? '深色' : '浅色'; });
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function setVariant(nextKey) {
      const url = new URL(window.location.href);
      url.searchParams.set('variant', nextKey);
      window.history.replaceState({}, '', url);
      activeFilter = '全部';
      render();
    }

    function stepVariant(direction) {
      const currentIndex = variants.findIndex((variant) => variant.key === currentKey());
      setVariant(variants[(currentIndex + direction + variants.length) % variants.length].key);
    }

    function updateFilter(filter) {
      activeFilter = filter;
      const key = currentKey();
      document.querySelectorAll('[data-filter]').forEach((button) => button.classList.toggle('active', button.dataset.filter === filter));
      document.querySelectorAll('[data-filter-list]').forEach((list) => { list.innerHTML = key === 'B' ? postRows('stream') : key === 'C' ? postRows('quiet') : postRows(); });
    }

    function openSearch() { document.getElementById('search-modal').hidden = false; const input = document.getElementById('search-input'); input.value = ''; document.getElementById('search-result').textContent = '这是原型中的搜索控件示意。'; input.focus(); }
    function closeSearch() { document.getElementById('search-modal').hidden = true; }

    document.addEventListener('click', (event) => {
      const filter = event.target.closest('[data-filter]');
      if (filter) { updateFilter(filter.dataset.filter); return; }
      if (event.target.closest('[data-previous]')) { stepVariant(-1); return; }
      if (event.target.closest('[data-next]')) { stepVariant(1); return; }
      if (event.target.closest('[data-theme-toggle]')) { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; render(); return; }
      if (event.target.closest('[data-search-open]')) { openSearch(); return; }
      if (event.target.closest('[data-search-close]') || event.target === document.getElementById('search-modal')) { closeSearch(); return; }
      if (event.target.closest('[data-back-top]')) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (event.target.closest('[data-console-toggle]')) { const drawer = document.getElementById('console-drawer'); if (drawer) drawer.hidden = !drawer.hidden; }
    });
    document.addEventListener('keydown', (event) => {
      const tag = document.activeElement?.tagName;
      if (event.key === 'Escape') closeSearch();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
      if (event.key === 'ArrowLeft') stepVariant(-1);
      if (event.key === 'ArrowRight') stepVariant(1);
    });
    document.getElementById('search-input').addEventListener('input', (event) => {
      const query = event.target.value.trim().toLowerCase();
      const matches = query ? posts.filter((post) => `${post.title} ${post.excerpt} ${post.category} ${post.tags.join(' ')}`.toLowerCase().includes(query)).length : 0;
      document.getElementById('search-result').textContent = query ? `原型搜索结果：找到 ${matches} 条匹配记录。` : '这是原型中的搜索控件示意。';
    });

    render();
    const drawer = document.createElement('aside');
    drawer.className = 'console-drawer';
    drawer.id = 'console-drawer';
    drawer.hidden = true;
    drawer.innerHTML = `<h3>Console</h3><div class="drawer-grid"><a href="#articles">Recent notes</a><a href="#archive">Archive</a><a href="#tags">Tags</a><a href="#memory">Memory shelf</a><button type="button" data-theme-toggle>Display mode</button><button type="button" data-back-top>Back to top</button></div>`;
    document.body.appendChild(drawer);
  </script>
</body>
</html>
