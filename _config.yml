# RegulusApple's Blog — Hexo site configuration
title: RegulusApple's Blog
subtitle: Record，Remember，Reinvent，Revolutionize
description: 一个记录学习、项目、读书与生活的个人角落。
author: RegulusApple
language: zh-CN
timezone: Asia/Shanghai
url: https://www.regulusapplex.space
root: /
permalink: notes/:title/
permalink_defaults:
  lang: zh-CN

theme: regulusapples-blog
new_post_name: :year-:month-:day-:title.md
default_layout: post
post_asset_folder: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: '  '
prismjs:
  enable: false

markdown:
  preset: default
  render:
    html: true
    breaks: false
    linkify: true
    typographer: true
  plugins:
    - '@renbaoshuo/markdown-it-katex'
  images:
    lazyload: true

search:
  path: search.json
  field: post
  content: true

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  enabled: true
  per_page: 10
  yearly: true
  monthly: true

category_generator:
  per_page: 10

tag_generator:
  per_page: 10

deploy:
  type: ''
